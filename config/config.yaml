# Hyperliquid Market Maker Configuration

exchange:
  name: hyperliquid
  rest_url: https://api.hyperliquid.xyz
  ws_url: wss://api.hyperliquid.xyz/ws
  testnet: false
  testnet_rest_url: https://api.hyperliquid-testnet.xyz
  testnet_ws_url: wss://api.hyperliquid-testnet.xyz/ws

trading:
  # Trading symbol
  symbol: BTC

  # Order size in USD notional
  order_notional_usd: 1.0

  # Base spread in basis points (0.06% = 6 bps)
  # Must cover roundtrip maker fees (0.052%) + safety margin
  base_spread_bps: 6.0

  # Minimum profitable spread (must cover fees)
  min_profitable_spread_bps: 6.0

  # Number of price levels to quote
  num_levels: 3

  # Order refresh interval in milliseconds
  refresh_interval_ms: 5000

  # Volatility multiplier for spread widening
  volatility_multiplier: 1.5

  # Maximum order time-to-live in seconds
  max_order_ttl_seconds: 30

hedging:
  # Enable automatic hedging
  enabled: true

  # Minimum hedge offset in basis points
  # Must ensure profitability after fees
  hedge_offset_bps: 6.0

  # Maximum hedge placement attempts
  max_hedge_attempts: 5

  # Hedge timeout in seconds
  hedge_timeout_seconds: 60

  # Price improvement per retry in basis points
  retry_price_improvement_bps: 1.0

risk:
  # Maximum inventory in USD (either direction)
  max_inventory_usd: 5.0

  # Maximum position notional in USD
  max_position_notional_usd: 10.0

  # Maximum time to hold unhedged position (seconds)
  max_unhedged_duration_seconds: 30

  # Maximum daily loss in USD
  max_daily_loss_usd: 10.0

  # Maximum position imbalance ratio (0-1)
  max_position_imbalance_ratio: 0.8

  # Latency threshold for circuit breaker (milliseconds)
  latency_threshold_ms: 500

  # Maximum consecutive failures before circuit breaker
  max_consecutive_failures: 10

  # Circuit breaker cooldown in seconds
  circuit_breaker_cooldown_seconds: 300

subaccount:
  # Enable sub-account trading
  enabled: false

  # Sub-account address (set in environment variable)
  subaccount_address: null

logging:
  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: INFO

  # Log format: json or console
  format: json

  # Enable file logging
  file_enabled: true

  # Log file path
  file_path: logs/trading.log

  # Enable console logging
  console_enabled: true

  # Maximum log file size in MB
  max_file_size_mb: 100

  # Number of backup log files
  backup_count: 10

monitoring:
  # Enable Prometheus metrics
  enabled: false

  # Prometheus metrics port
  prometheus_port: 8000

  # Metrics collection interval in seconds
  metrics_interval_seconds: 60

version: '3.8'

services:
  market-maker:
    build: .
    container_name: hyperliquid-market-maker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - trading-network
    ports:
      - "8000:8000"  # Prometheus metrics (if enabled)
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  trading-network:
    driver: bridge
